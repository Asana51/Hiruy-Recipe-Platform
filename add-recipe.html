<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>Hiruy Recipe Platform</h1>
      <nav><a href="recipe.html">Recipe</a></nav>
    </header>

    <main>
      <section>
        <form>
          <div>
            <label for="Recipe Name">Recipe Name</label>
            <input type="text" id="recipe-name" name="recipe" />
          </div>
          <br />
          <div>
            <label for="breakfast-input">breakfast</label>
            <input type="text" id="breakfast-input" />
          </div>
          <br />
          <div>
            <label for="lunch-input">lunch</label>
            <input type="text" id="lunch-input" />
          </div>
          <br />
          <div>
            <label for="dinner-input">dinner</label>
            <input type="text" id="dinner-input" />
          </div>
          <br />
          <div>
            <label for="dessert-input">dessert</label>
            <input type="text" id="dessert-input" />
          </div>
          <br />
          <div>
            <label for="snack-input">snack</label>
            <input type="text" id="snack" />
          </div>
          <br />
          <div>
            <label for="preparation step">preparation</label>
            <input type="text" />
          </div>
          <br />
          <div>
            <label for="servings">servings</label>
            <input type="number" />
          </div>
          <br />
          <div>
            <button type="submit">submit</button>
          </div>
        </form>
      </section>
    </main>

    <hr />
    <footer>Hiruy Recipe Platform, 2026</footer>
